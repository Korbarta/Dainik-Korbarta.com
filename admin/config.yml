backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "en"

collections:
  - name: "articles"
    label: "সংবাদ"
    files:
      - file: "content/articles.json"
        label: "সকল সংবাদ পরিচালনা করুন"
        name: "articles"
        fields:
          - label: "সংবাদসমূহ"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "শিরোনাম", name: "title", widget: "string"}
              - {label: "প্রকাশের তারিখ ও সময়", name: "date", widget: "datetime"}
              - label: "বিভাগ"
                name: "category"
                widget: "select"
                options: ["সারাদেশ","জেলা সংবাদ","মফস্বল সংবাদ","জাতীয়","অর্থনীতি","খেলা","বিনোদন","রাজনীতি","বিজ্ঞান ও প্রযুক্তি","আন্তর্জাতিক","যোগাযোগ","মতামত","স্বাস্থ্য","পাঠক সংবাদ"]
              - {label: "প্রতিবেদক", name: "reporter", widget: "string", required: false, hint: "সংবাদটি কে লিখেছেন তার নাম"}
              - {label: "ছবি (ঐচ্ছিক)", name: "image", widget: "image", required: false}
              - {label: "সংক্ষিপ্তসার", name: "excerpt", widget: "text"}
              - {label: "বিস্তারিত সংবাদ", name: "body", widget: "text"}
              - {label: "প্রধান সংবাদ হিসেবে দেখান", name: "featured", widget: "boolean", default: false}

  - name: "settings"
    label: "সেটিংস"
    files:
      - file: "content/settings.json"
        label: "সাধারণ সেটিংস"
        name: "settings"
        fields:
          - {label: "পত্রিকার নাম", name: "site_title", widget: "string"}
          - {label: "ট্যাগলাইন", name: "tagline", widget: "string"}
          - label: "ব্রেকিং নিউজ"
            name: "breaking_news"
            widget: "list"
            fields:
              - {label: "বার্তা", name: "text", widget: "string"}
          - label: "বিজ্ঞাপন"
            name: "advertisement"
            widget: "object"
            required: false
            fields:
              - {label: "বিজ্ঞাপনদাতার নাম", name: "advertiser_name", widget: "string", required: false}
              - {label: "বিজ্ঞাপনের ছবি", name: "ad_image", widget: "image", required: false, hint: "প্রস্তাবিত সাইজ: ৩০০x২৫০ বা ৭২৮x৯০ পিক্সেল"}
              - {label: "ক্লিক করলে যে লিংকে যাবে", name: "ad_link", widget: "string", required: false, hint: "যেমন: বিজ্ঞাপনদাতার ওয়েবসাইট"}
